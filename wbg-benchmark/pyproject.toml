[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbg-benchmark"
version = "0.1.0"
description = "GaN and 4H-SiC computational screening with Quantum ESPRESSO"
requires-python = ">=3.11"
dependencies = ["ase>=3.24,<4", "pymatgen>=2025.1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
wbg = "wbg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
