[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-quantum-chemistry"
version = "0.1.0"
description = "Small-molecule DFT and molecular Hamiltonian workflows for Colab"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2,<3",
  "pyscf>=2.7,<3",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pandas>=2"]
gpu-cuda12 = [
  "gpu4pyscf-cuda12x==1.9.2",
  "gpu4pyscf-libxc-cuda12x==0.9.0",
  "cupy-cuda12x==13.4.1",
  "cutensor-cu12==2.2.0",
]
gpu-cuda13 = [
  "gpu4pyscf-cuda13x==1.9.2",
  "gpu4pyscf-libxc-cuda13x==0.9.0",
  "cupy-cuda13x==14.0.1",
  "cutensor-cu13==2.3.1",
]

[project.scripts]
quantum-workflow = "quantum_workflow.cli:main"
quantum-workflow-mcp = "quantum_workflow.mcp_server:main"

[tool.setuptools.packages.find]
include = ["quantum_workflow*", "lihbn_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
