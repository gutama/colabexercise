[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-quantum-chemistry"
version = "0.2.0"
description = "Template: molecular Hamiltonians from PySCF/QE to qubit operators, locally or on Colab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2,<3",
  "pyscf>=2.7,<3",
  "mcp>=1.9,<2",  # mcp 2.x renamed FastMCP; migrate before raising this pin
]

[project.optional-dependencies]
# Qubit Hamiltonian export and the ADAPT-VQE reference solver.
qubit = ["openfermion>=1.6"]
# scripts/verify_colab.py installs only [test] and runs the whole suite, so it includes OpenFermion.
test = ["pytest>=8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "pandas>=2",
        "openfermion>=1.6"]
# Qiskit only cross-checks qubit ordering (that test skips without it).
dev = ["ruff>=0.6", "qiskit>=1.0"]
# Pinned GPU4PySCF stacks; colab_runtime.cuda_extra() picks one from the installed nvcc.
gpu-cuda12 = [
  "gpu4pyscf-cuda12x==1.9.2",
  "gpu4pyscf-libxc-cuda12x==0.9.0",
  "cupy-cuda12x==13.4.1",
  "cutensor-cu12==2.2.0",
]
gpu-cuda13 = [
  "gpu4pyscf-cuda13x==1.9.2",
  "gpu4pyscf-libxc-cuda13x==0.9.0",
  "cupy-cuda13x==14.0.1",
  "cutensor-cu13==2.4.1",
]

[project.scripts]
quantum-workflow = "quantum_workflow.cli:main"
quantum-workflow-adapt = "quantum_workflow.adapt:main"
quantum-workflow-colab = "quantum_workflow.colab:main"
quantum-workflow-mcp = "quantum_workflow.mcp_server:main"

[tool.setuptools.packages.find]
include = ["quantum_workflow*", "lihbn_repro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-second chemistry runs (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py310"
# lihbn_repro is a separate research package with its own CI workflow (lihbn-repro.yml).
extend-exclude = ["build", "notebooks", "lihbn_repro", "experiments", "tests/test_lihbn_repro.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Colab runtime/verification code keeps its original ~120-column style.
"scripts/verify_colab.py" = ["E501", "I001"]
"quantum_workflow/colab_runtime.py" = ["E501", "I001"]
"tests/test_colab_gpu.py" = ["E501"]
